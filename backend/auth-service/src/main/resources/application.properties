spring.application.name=auth-service
server.port=8081

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:social_auth}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema. Con ddl-auto=none Hibernate no intenta
# modificarlo por su cuenta, que es lo que enmascararia una migracion ausente
# hasta que el mismo esquema se desplegara en produccion.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

social.jwt.secret=${JWT_SECRET}
social.jwt.issuer=${JWT_ISSUER:social-auth-service}
social.jwt.expiration=${JWT_EXPIRATION_MINUTES:60}m

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

server.forward-headers-strategy=framework