# Configuracion exclusiva de las pruebas.
#
# Este archivo SUSTITUYE al de src/main/resources durante los tests

spring.application.name=post-service

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

social.jwt.secret=secreto-exclusivo-de-pruebas-con-mas-de-32-bytes
social.jwt.issuer=social-auth-service-test

# Los mismos endpoints que expone la aplicacion.
management.endpoints.web.exposure.include=health,info
