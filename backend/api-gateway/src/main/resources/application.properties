spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:file:../../.env[.properties]

# Los nombres de servicio los resuelve el DNS interno de Docker.
social.gateway.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}
social.gateway.post-service-url=${POST_SERVICE_URL:http://localhost:8082}
social.gateway.allowed-origins=${FRONTEND_ORIGIN:http://localhost:4200}

# El mismo secreto que auth-service y post-service: aqui solo se verifica.
social.jwt.secret=${JWT_SECRET}
social.jwt.issuer=${JWT_ISSUER:social-auth-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Una sola interfaz de Swagger con desplegable para los dos servicios.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/api-docs/auth
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=/api-docs/posts

spring.cloud.gateway.server.webmvc.trusted-proxies=.*
